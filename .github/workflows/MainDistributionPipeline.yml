#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    branches:
      - v2.0-cyanoptera
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  push:
    branches:
      - v2.0-cyanoptera
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true


permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@ae971e03c1840a1c6c2d81b91d1ec851f297f720 # v2.0-cyanoptera 2026-11-06 pin
    with:
      duckdb_version: 925bcdf35756dca26ada5228a0c76dc227c5aca5 # v2.0.0 RC
      ci_tools_version: ae971e03c1840a1c6c2d81b91d1ec851f297f720 # v2.0-cyanoptera 2026-11-06 pin
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      exclude_archs: 'linux_amd64_musl'
      runners: ${{ needs.prepare.outputs.runners }}

  deploy:
    name: Deploy extension
    if: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
    needs: build
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@ae971e03c1840a1c6c2d81b91d1ec851f297f720 # v2.0-cyanoptera 2026-11-06 pin
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      ci_tools_version: ae971e03c1840a1c6c2d81b91d1ec851f297f720 # v2.0-cyanoptera 2026-11-06 pin
      deploy_extensions: spatial
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  relassert:
    name: Build relassert
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 5GB
          evict-old-files: job
      - name: Build (relassert → ASan + UBSan + LSan)
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: relassert
          build: python3 duckdb/scripts/ci/retry.py -- make relassert
          test: make unittest_relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
